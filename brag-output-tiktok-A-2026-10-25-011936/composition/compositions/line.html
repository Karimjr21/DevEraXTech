  <script>
    gsap.registerPlugin(MotionPathPlugin);
    const CFG = {"cam": {"1": -1150, "2": -2300, "3": -3450, "4": -4600, "5": -5750, "6": -6900}, "wx": 1161.4285714285716, "wy": 773.8095238095239, "s_end": 0.42, "y_end": 330.0, "cy6": 7900, "bubble": [210, 5560]};
    const L = {};
    document.querySelectorAll("#ol-svg path").forEach((p) => {
      const len = p.getTotalLength();
      L[p.id || ""] = len;
      p.style.strokeDasharray = len + " " + (len + 2);
      p.style.strokeDashoffset = len;
      p.dataset.len = len;
    });
    // frame 0: the hook line is already moving, 10 % drawn
    const hook = document.getElementById("ol-hook");
    gsap.set("#ol-msg", { display: "none" });
    const h0 = hook.getPointAtLength(L["ol-hook"] * 0.1);
    hook.style.strokeDashoffset = L["ol-hook"] * 0.9;
    gsap.set("#ol-head", { x: h0.x, y: h0.y, scale: 1, opacity: 1 });
    gsap.set("#ol-world", { y: 0, scale: 1, transformOrigin: "540px 0px" });
    gsap.set("#ol-msg", { left: CFG.bubble[0], top: CFG.bubble[1], opacity: 0, filter: "blur(8px)" });
    gsap.set(".dot", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" });
    gsap.set(["#ol-l1", "#ol-l2", "#ol-l3", "#ol-l4", "#ol-l5", "#ol-l6", "#ol-l7"], { opacity: 0, filter: "blur(10px)" });

    const tl = gsap.timeline({ paused: true });
    function draw(id, t0, dur, ease, start) {
      const len = L[id];
      tl.fromTo("#" + id, { strokeDashoffset: len * (1 - (start || 0)) }, { strokeDashoffset: 0, duration: dur, ease }, t0);
      tl.to("#ol-head", { motionPath: { path: "#" + id, start: start || 0, end: 1 }, duration: dur, ease }, t0);
    }
    function details(k, t0) {
      document.querySelectorAll("#ol-d" + k + " path").forEach((p, i) => {
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" }, t0 + i * 0.015);
      });
    }
    // host starts 16.75 s, under the question card; one service per 0.85 s, each held before the camera moves on
    draw("ol-hook", 0, 0.55, "power1.in", 0.1);
    for (let k = 1; k <= 6; k++) {
      const t = 0.55 + (k - 1) * 0.85;
      tl.to("#ol-world", { y: CFG.cam[k], duration: 0.22, ease: "power2.inOut" }, t - 0.22);
      draw("ol-o" + k, t, 0.3, "power2.inOut");
      details(k, t + 0.14);
      if (k < 6) draw("ol-b" + k, t + 0.6, 0.25, "power1.in");
      else draw("ol-b6", t + 0.6, 0.15, "power2.out");
      tl.to("#ol-l" + k, { opacity: 1, filter: "blur(0px)", duration: 0.12, ease: "power4.out" }, t);
      tl.to("#ol-l" + k, { opacity: 0, filter: "blur(8px)", duration: 0.1, ease: "power3.in" }, t + 0.73);
    }
    tl.to(".dot", { opacity: 1, scale: 1, duration: 0.12, ease: "back.out(1.6)", stagger: 0.06 }, 3.4);
    // pull back: everything one team builds, as one line
    tl.to("#ol-world", { scale: CFG.s_end, y: 1000 - CFG.s_end * CFG.cy6, duration: 0.35, ease: "power2.inOut" }, 5.6);
    tl.to("#ol-head", { scale: 2.1, duration: 0.35, ease: "power2.inOut" }, 5.6);
    tl.to("#ol-world", { y: CFG.y_end, duration: 0.65, ease: "power3.inOut" }, 5.95);
    tl.to("#ol-l7", { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 5.62);
    tl.to(["#ol-l7", "#ol-lines", "#ol-head"], { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 7.15);
