<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-paper","type":"color","label":"Paper","default":"#faf7f0"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#111111"},
    {"id":"color-gold","type":"color","label":"Gold ink","default":"#7a5c0e"},
    {"id":"color-rule","type":"color","label":"Gold rule","default":"#b08a24"},
    {"id":"font-display","type":"string","label":"Display font","default":"EB Garamond"},
    {"id":"font-mono","type":"string","label":"Mono font","default":"IBM Plex Mono"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-paper: #faf7f0;
        --color-ink: #111111;
        --color-gold: #7a5c0e;
        --color-rule: #b08a24;
        --font-display: "EB Garamond";
        --font-mono: "IBM Plex Mono";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--color-paper);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="38.6" data-width="1080" data-height="1920">
      <div id="paper" data-composition-id="paper" data-composition-src="compositions/paper.html"
        data-start="0" data-duration="38.6" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="file1" data-composition-id="file1" data-composition-src="compositions/file1.html"
        data-start="4" data-duration="5.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="file2" data-composition-id="file2" data-composition-src="compositions/file2.html"
        data-start="9.5" data-duration="8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="file3" data-composition-id="file3" data-composition-src="compositions/file3.html"
        data-start="17.5" data-duration="8.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="guess" data-composition-id="guess" data-composition-src="compositions/guess.html"
        data-start="26" data-duration="2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
        data-start="28" data-duration="6.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="signoff" data-composition-id="signoff" data-composition-src="compositions/signoff.html"
        data-start="34.4" data-duration="4.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <!-- The open loop: Q1's answer as letter tiles, one letter per file -->
      <div id="tiles" data-composition-id="tiles" data-composition-src="compositions/tiles.html"
        data-start="9.5" data-duration="16.5" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>

      <!-- Music: the bed cuts out for the guess, then the drop returns on the reveal -->
      <audio id="music-a" class="clip" data-start="0" data-duration="26.2" data-media-start="3.02" data-track-index="10"
        data-volume="0.34" data-fade-in="0.05" data-fade-out="0.35" src="assets/music/music.mp3"></audio>
      <audio id="music-b" class="clip" data-start="28" data-duration="10.6" data-media-start="40.82" data-track-index="9"
        data-volume="0.36" data-fade-in="0.02" data-fade-out="1.6" src="assets/music/music.mp3"></audio>

      <!-- Hook typing -->
      <audio id="sfx-k1" class="clip" data-start="0.12" data-duration="0.25" data-track-index="11" data-volume="0.5" src="assets/sfx/keypress-003.wav"></audio>
      <audio id="sfx-k2" class="clip" data-start="0.3" data-duration="0.25" data-track-index="12" data-volume="0.5" src="assets/sfx/keypress-012.wav"></audio>
      <audio id="sfx-k3" class="clip" data-start="0.48" data-duration="0.25" data-track-index="13" data-volume="0.5" src="assets/sfx/keypress-024.wav"></audio>
      <audio id="sfx-stamp-hook" class="clip" data-start="1.48" data-duration="0.33" data-track-index="14" data-volume="0.75" src="assets/sfx/impactWood_heavy_001.ogg"></audio>
      <!-- File 01 -->
      <audio id="sfx-page1" class="clip" data-start="3.75" data-duration="0.6" data-track-index="15" data-volume="0.6" src="assets/sfx/card-slide-1.ogg"></audio>
      <audio id="sfx-k4" class="clip" data-start="4.62" data-duration="0.25" data-track-index="16" data-volume="0.45" src="assets/sfx/keypress-007.wav"></audio>
      <audio id="sfx-k5" class="clip" data-start="4.8" data-duration="0.25" data-track-index="17" data-volume="0.45" src="assets/sfx/keypress-018.wav"></audio>
      <audio id="sfx-redact" class="clip" data-start="7.0" data-duration="0.69" data-track-index="18" data-volume="0.6" src="assets/sfx/card-place-1.ogg"></audio>
      <audio id="sfx-stamp-1" class="clip" data-start="7.98" data-duration="0.33" data-track-index="19" data-volume="0.7" src="assets/sfx/impactWood_medium_002.ogg"></audio>
      <!-- File 02 -->
      <audio id="sfx-page2" class="clip" data-start="9.25" data-duration="0.6" data-track-index="20" data-volume="0.6" src="assets/sfx/card-slide-5.ogg"></audio>
      <audio id="sfx-shutter" class="clip" data-start="9.98" data-duration="0.5" data-track-index="21" data-volume="0.7" src="assets/sfx/switch_004.ogg"></audio>
      <audio id="sfx-tile-s" class="clip" data-start="11.0" data-duration="0.46" data-track-index="22" data-volume="0.6" src="assets/sfx/card-place-2.ogg"></audio>
      <audio id="sfx-row1" class="clip" data-start="14.0" data-duration="0.11" data-track-index="23" data-volume="0.7" src="assets/sfx/drop_001.ogg"></audio>
      <audio id="sfx-row2" class="clip" data-start="15.0" data-duration="0.11" data-track-index="24" data-volume="0.7" src="assets/sfx/drop_001.ogg"></audio>
      <audio id="sfx-row3" class="clip" data-start="16.0" data-duration="0.11" data-track-index="25" data-volume="0.7" src="assets/sfx/drop_001.ogg"></audio>
      <audio id="sfx-tile-c" class="clip" data-start="16.5" data-duration="0.46" data-track-index="26" data-volume="0.6" src="assets/sfx/card-place-2.ogg"></audio>
      <!-- File 03 -->
      <audio id="sfx-page3" class="clip" data-start="17.25" data-duration="0.6" data-track-index="27" data-volume="0.6" src="assets/sfx/card-slide-1.ogg"></audio>
      <audio id="sfx-stamp-3" class="clip" data-start="17.5" data-duration="0.33" data-track-index="28" data-volume="0.75" src="assets/sfx/impactWood_heavy_001.ogg"></audio>
      <audio id="sfx-msg1" class="clip" data-start="21.5" data-duration="0.06" data-track-index="29" data-volume="0.8" src="assets/sfx/mouseclick1.ogg"></audio>
      <audio id="sfx-msg2" class="clip" data-start="22.5" data-duration="0.06" data-track-index="30" data-volume="0.8" src="assets/sfx/mouseclick1.ogg"></audio>
      <audio id="sfx-tile-h" class="clip" data-start="21.0" data-duration="0.46" data-track-index="31" data-volume="0.6" src="assets/sfx/card-place-2.ogg"></audio>
      <audio id="sfx-tile-e" class="clip" data-start="24.5" data-duration="0.46" data-track-index="32" data-volume="0.6" src="assets/sfx/card-place-2.ogg"></audio>
      <!-- Guess (music out) -->
      <audio id="sfx-guess" class="clip" data-start="26.05" data-duration="0.88" data-track-index="33" data-volume="0.75" src="assets/sfx/card-place-3.ogg"></audio>
      <audio id="sfx-tick1" class="clip" data-start="27.0" data-duration="0.25" data-track-index="34" data-volume="0.4" src="assets/sfx/keypress-029.wav"></audio>
      <audio id="sfx-tick2" class="clip" data-start="27.5" data-duration="0.25" data-track-index="35" data-volume="0.45" src="assets/sfx/keypress-029.wav"></audio>
      <!-- Reveal -->
      <audio id="sfx-flip-m" class="clip" data-start="28.0" data-duration="0.6" data-track-index="36" data-volume="0.7" src="assets/sfx/card-place-4.ogg"></audio>
      <audio id="sfx-flip-a" class="clip" data-start="28.25" data-duration="0.6" data-track-index="37" data-volume="0.7" src="assets/sfx/card-place-4.ogg"></audio>
      <audio id="sfx-solved" class="clip" data-start="28.5" data-duration="0.3" data-track-index="38" data-volume="0.8" src="assets/sfx/impactBell_heavy_004.ogg"></audio>
      <audio id="sfx-solved-2" class="clip" data-start="28.52" data-duration="0.23" data-track-index="39" data-volume="0.5" src="assets/sfx/chips-collide-2.ogg"></audio>
      <audio id="sfx-page4" class="clip" data-start="34.15" data-duration="0.6" data-track-index="40" data-volume="0.55" src="assets/sfx/card-slide-5.ogg"></audio>
      <audio id="sfx-logo" class="clip" data-start="35.4" data-duration="0.3" data-track-index="41" data-volume="0.75" src="assets/sfx/impactBell_heavy_004.ogg"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
