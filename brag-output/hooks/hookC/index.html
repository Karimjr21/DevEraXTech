<script>
// intentional starting construction: components sit a few pixels off their slots
gsap.set("#ph", { scale: 0.93, rotation: -1.5, x: -14, y: 10 });

const tl = gsap.timeline({ paused: true });
const snap = { x: 0, y: 0, rotation: 0, scale: 1, duration: 0.38, ease: "power3.out" };
tl.to("#ph", snap, 0.35);
tl.to(["#p-nav","#p-pv"], snap, 0.4);

tl.to("#flash", { opacity: 1, scaleX: 1, duration: 0.3, ease: "expo.out" }, 0.9);
tl.to("#flash", { opacity: 0, duration: 0.4, ease: "power2.in" }, 1.4);
