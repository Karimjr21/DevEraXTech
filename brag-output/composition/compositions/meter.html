<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "Inter", sans-serif;
    }
    #mt-box {
      position: absolute;
      top: 230px;
      left: 150px;
      width: 780px;
      padding: 22px 30px 24px;
      border-radius: 22px;
      border: 1px solid rgba(212, 175, 55, 0.45);
      background: rgba(18, 16, 10, 0.78);
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.18);
    }
    .mt-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 28px;

      letter-spacing: 0.16em;

    }
    #mt-label b {
      color: #f5d573;
    }
    #mt-pct {
      font-size: 36px;
      letter-spacing: 0;
      color: #f5d573;
      font-variant-numeric: tabular-nums;
    }
    .mt-track {
      margin-top: 14px;
      height: 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }
    #mt-fill {
      width: 100%;
      height: 100%;
      transform-origin: 0 50%;
      background: linear-gradient(90deg, #d4af37, #f5d573);
      box-shadow: 0 0 14px rgba(245, 213, 115, 0.9);
    }
  </style>
  <div id="root" data-composition-id="meter" data-width="1080" data-height="1920">
    <div id="mt-box">
      <div class="mt-row"><span id="mt-label"><b>Q1</b> · ANSWER LOADING</span><span id="mt-pct">18%</span></div>
      <div class="mt-track"><div id="mt-fill"></div></div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const pctEl = document.getElementById("mt-pct");
      const p = { v: 18 };
      const show = () => (pctEl.textContent = Math.round(p.v) + "%");

      tl.fromTo("#mt-box", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.1);
      tl.fromTo("#mt-fill", { scaleX: 0.18 }, { scaleX: 0.18, duration: 0.01 }, 0);
      tl.fromTo(p, { v: 18 }, { v: 18, duration: 0.01, onUpdate: show }, 0);

      // Bursts of progress, then stalls: always almost there.
      const steps = [
        [3.4, 1.2, 29], [6.4, 0.9, 41],   // during Q2
        [9.0, 1.1, 58], [11.2, 0.8, 67], // into Q3
        [14.2, 1.3, 94],
      ];
      steps.forEach(([at, d, to]) => {
        tl.to("#mt-fill", { scaleX: to / 100, duration: d, ease: "power3.out" }, at);
        tl.to(p, { v: to, duration: d, ease: "power3.out", onUpdate: show }, at);
        tl.to("#mt-box", { boxShadow: "0 0 60px rgba(245,213,115,0.45)", duration: d * 0.5, ease: "power2.out" }, at)
          .to("#mt-box", { boxShadow: "0 0 40px rgba(212,175,55,0.18)", duration: d * 0.5, ease: "power2.in" }, at + d * 0.5);
      });

      tl.to("#mt-box", { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" }, 16.6);
      window.__timelines["meter"] = tl;
    })();
  </script>
