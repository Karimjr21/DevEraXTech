  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const pctEl = document.getElementById("tn-pct");
      const p = { v: 94 };
      const show = () => (pctEl.textContent = Math.round(p.v) + "%");

      tl.fromTo("#tn-wrap", { opacity: 0, scale: 0.94, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0);

      tl.fromTo(p, { v: 94 }, { v: 99, duration: 1.0, ease: "power2.out", onUpdate: show }, 0.2);
      tl.fromTo("#tn-dont", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 0.75);

      // Stall glitch at 99%: horizontal jitter + flicker.
      tl.to("#tn-pct", { x: -10, opacity: 0.4, duration: 0.04 }, 1.28)
        .to("#tn-pct", { x: 8, opacity: 1, duration: 0.04 }, 1.32)
        .to("#tn-pct", { x: -4, opacity: 0.5, duration: 0.04 }, 1.36)
        .to("#tn-pct", { x: 0, opacity: 1, duration: 0.04 }, 1.4);
      tl.to("#tn-fill", { opacity: 0.3, duration: 0.04 }, 1.3).to("#tn-fill", { opacity: 1, duration: 0.04 }, 1.38);

      // Final push to 100 right at the cut.

      window.__timelines["tension"] = tl;
