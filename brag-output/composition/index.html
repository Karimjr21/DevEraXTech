<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#0a0a0a"},
    {"id":"color-ink","type":"color","label":"Text","default":"#ffffff"},
    {"id":"color-accent","type":"color","label":"Gold","default":"#d4af37"},
    {"id":"color-accent-hi","type":"color","label":"Gold highlight","default":"#f5d573"},
    {"id":"font-display","type":"string","label":"Display font","default":"Playfair Display"},
    {"id":"font-body","type":"string","label":"Body font","default":"Inter"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #0a0a0a;
        --color-ink: #ffffff;
        --color-accent: #d4af37;
        --color-accent-hi: #f5d573;
        --font-display: "Playfair Display";
        --font-body: "Inter";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--color-ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40"
      data-width="1080"
      data-height="1920"
    >
      <!-- Ambient ground: gold glow (audio-reactive), dust, grain, vignette -->
      <div id="ambience" data-composition-id="ambience" data-composition-src="compositions/ambience.html"
        data-start="0" data-duration="40" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Scenes -->
      <div id="hook1" data-composition-id="hook1" data-composition-src="compositions/hook1.html"
        data-start="0" data-duration="4.39" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="q1" data-composition-id="q1" data-composition-src="compositions/q1.html"
        data-start="4.39" data-duration="4.9" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="q2" data-composition-id="q2" data-composition-src="compositions/q2.html"
        data-start="9.29" data-duration="8.18" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="q3" data-composition-id="q3" data-composition-src="compositions/q3.html"
        data-start="17.47" data-duration="8.73" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="tension" data-composition-id="tension" data-composition-src="compositions/tension.html"
        data-start="26.2" data-duration="2.18" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="answer" data-composition-id="answer" data-composition-src="compositions/answer.html"
        data-start="28.38" data-duration="6.62" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="35" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <!-- Q1 answer meter that rides over Q2 and Q3: the open loop -->
      <div id="meter" data-composition-id="meter" data-composition-src="compositions/meter.html"
        data-start="9.29" data-duration="16.91" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>

      <!-- Music bed -->
      <audio id="music" class="clip" data-start="0" data-duration="40" data-track-index="10"
        data-volume="0.32" data-fade-in="0.2" data-fade-out="3" src="assets/music/music.mp3"></audio>

      <!-- SFX: each sits on its own lane, timed to the visual it supports -->
      <audio id="sfx-hook-bell" class="clip" data-start="1.04" data-duration="1.48" data-track-index="11" data-volume="0.62" src="assets/sfx/impactBell_heavy_000.ogg"></audio>
      <audio id="sfx-q1-title" class="clip" data-start="4.84" data-duration="0.18" data-track-index="12" data-volume="0.7" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-q1-stall" class="clip" data-start="7.86" data-duration="0.02" data-track-index="13" data-volume="0.45" src="assets/sfx/glitch_004.ogg"></audio>
      <audio id="sfx-hook2" class="clip" data-start="9.4" data-duration="0.19" data-track-index="14" data-volume="0.6" src="assets/sfx/drop_002.ogg"></audio>
      <audio id="sfx-q2-title" class="clip" data-start="12.1" data-duration="0.14" data-track-index="15" data-volume="0.65" src="assets/sfx/impactSoft_medium_003.ogg"></audio>
      <audio id="sfx-chip-1" class="clip" data-start="13.64" data-duration="0.21" data-track-index="16" data-volume="0.55" src="assets/sfx/impactGlass_light_001.ogg"></audio>
      <audio id="sfx-chip-2" class="clip" data-start="14.73" data-duration="0.21" data-track-index="17" data-volume="0.55" src="assets/sfx/impactGlass_light_002.ogg"></audio>
      <audio id="sfx-chip-3" class="clip" data-start="15.82" data-duration="0.21" data-track-index="18" data-volume="0.55" src="assets/sfx/impactGlass_light_003.ogg"></audio>
      <audio id="sfx-hook3" class="clip" data-start="17.47" data-duration="0.18" data-track-index="19" data-volume="0.72" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-q3-title" class="clip" data-start="20.28" data-duration="0.14" data-track-index="20" data-volume="0.65" src="assets/sfx/impactSoft_medium_003.ogg"></audio>
      <audio id="sfx-pass-1" class="clip" data-start="22.17" data-duration="0.21" data-track-index="21" data-volume="0.55" src="assets/sfx/impactGlass_light_001.ogg"></audio>
      <audio id="sfx-pass-2" class="clip" data-start="23.26" data-duration="0.21" data-track-index="22" data-volume="0.55" src="assets/sfx/impactGlass_light_002.ogg"></audio>
      <audio id="sfx-pass-3" class="clip" data-start="24.35" data-duration="0.21" data-track-index="23" data-volume="0.55" src="assets/sfx/impactGlass_light_003.ogg"></audio>
      <audio id="sfx-tension" class="clip" data-start="26.22" data-duration="1.48" data-track-index="24" data-volume="0.5" src="assets/sfx/dice-shake-1.ogg"></audio>
      <audio id="sfx-stall" class="clip" data-start="27.48" data-duration="0.02" data-track-index="25" data-volume="0.5" src="assets/sfx/glitch_004.ogg"></audio>
      <audio id="sfx-no" class="clip" data-start="28.9" data-duration="1.48" data-track-index="26" data-volume="0.8" src="assets/sfx/impactBell_heavy_000.ogg"></audio>
      <audio id="sfx-card" class="clip" data-start="32.45" data-duration="0.6" data-track-index="27" data-volume="0.55" src="assets/sfx/card-slide-3.ogg"></audio>
      <audio id="sfx-logo" class="clip" data-start="35.08" data-duration="0.65" data-track-index="28" data-volume="0.7" src="assets/sfx/impactBell_heavy_003.ogg"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
