<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* soft top and bottom shade so captions read over any shot */
      #shade {
        position: absolute;
        inset: 0;
        z-index: 3;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0) 32%, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, 0.35) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.0" data-width="1080" data-height="1920">
      <video id="v-h1-hands" class="clip" data-start="0.0" data-duration="3.85" data-track-index="1" muted playsinline src="assets/footage/h1-hands.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <video id="v-h2-upset" class="clip" data-start="3.85" data-duration="3.75" data-track-index="2" muted playsinline src="assets/footage/h2-upset.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <video id="v-q1-woman" class="clip" data-start="7.6" data-duration="2.5" data-track-index="1" muted playsinline src="assets/footage/q1-woman.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <video id="v-q1-hand" class="clip" data-start="10.1" data-duration="2.53" data-track-index="2" muted playsinline src="assets/footage/q1-hand.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <video id="v-q2-frustrated" class="clip" data-start="12.63" data-duration="6.99" data-track-index="1" muted playsinline src="assets/footage/q2-frustrated.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <video id="v-a1-walk" class="clip" data-start="19.62" data-duration="3.18" data-track-index="2" muted playsinline src="assets/footage/a1-walk.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <video id="v-a1-typing" class="clip" data-start="22.8" data-duration="2.51" data-track-index="1" muted playsinline src="assets/footage/a1-typing.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <video id="v-end-desk" class="clip" data-start="25.31" data-duration="4.69" data-track-index="2" muted playsinline src="assets/footage/end-desk.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <div id="shade"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="25.31" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="logo" data-composition-id="logo" data-composition-src="compositions/logo.html" data-start="25.31" data-duration="4.69" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>

      <!-- Footage: Mixkit (mixkit.co), Mixkit Stock Video Free License -->
      <!-- Music: "Investigations" by Kevin MacLeod (incompetech.com), CC BY 4.0 -->
      <audio id="music" class="clip" data-start="0" data-duration="30.0" data-track-index="10" data-volume="0.5" data-fade-out="1.2" src="assets/music/investigations-kevin-macleod.mp3"></audio>
      <audio id="s-w1" class="clip" data-start="0.36" data-duration="0.6" data-track-index="11" data-volume="0.35" src="assets/sfx/card-slide-2.ogg"></audio>
      <audio id="s-n1" class="clip" data-start="0.4" data-duration="0.3" data-track-index="12" data-volume="0.5" src="assets/sfx/card-place-1.ogg"></audio>
      <audio id="s-n2" class="clip" data-start="1.32" data-duration="0.3" data-track-index="13" data-volume="0.5" src="assets/sfx/card-place-2.ogg"></audio>
      <audio id="s-n3" class="clip" data-start="2.57" data-duration="0.3" data-track-index="14" data-volume="0.5" src="assets/sfx/card-place-3.ogg"></audio>
      <audio id="s-cut1" class="clip" data-start="3.85" data-duration="0.3" data-track-index="15" data-volume="0.6" src="assets/sfx/impactSoft_heavy_001.ogg"></audio>
      <audio id="s-n4" class="clip" data-start="4.54" data-duration="0.3" data-track-index="16" data-volume="0.5" src="assets/sfx/card-place-4.ogg"></audio>
      <audio id="s-c3" class="clip" data-start="5.71" data-duration="0.05" data-track-index="17" data-volume="0.5" src="assets/sfx/select_008.ogg"></audio>
      <audio id="s-cut2" class="clip" data-start="7.6" data-duration="0.3" data-track-index="18" data-volume="0.55" src="assets/sfx/impactWood_medium_002.ogg"></audio>
      <audio id="s-c5" class="clip" data-start="8.86" data-duration="0.05" data-track-index="19" data-volume="0.5" src="assets/sfx/select_008.ogg"></audio>
      <audio id="s-s2" class="clip" data-start="10.1" data-duration="0.05" data-track-index="20" data-volume="0.4" src="assets/sfx/select_008.ogg"></audio>
      <audio id="s-cut3" class="clip" data-start="12.63" data-duration="0.3" data-track-index="21" data-volume="0.6" src="assets/sfx/impactSoft_heavy_001.ogg"></audio>
      <audio id="s-c7" class="clip" data-start="15.78" data-duration="0.2" data-track-index="22" data-volume="0.5" src="assets/sfx/impactWood_medium_001.ogg"></audio>
      <audio id="s-c8" class="clip" data-start="17.66" data-duration="0.05" data-track-index="23" data-volume="0.5" src="assets/sfx/select_008.ogg"></audio>
      <audio id="s-cut4" class="clip" data-start="19.62" data-duration="0.3" data-track-index="24" data-volume="0.55" src="assets/sfx/impactWood_medium_002.ogg"></audio>
      <audio id="s-c10" class="clip" data-start="21.55" data-duration="0.05" data-track-index="25" data-volume="0.5" src="assets/sfx/select_008.ogg"></audio>
      <audio id="s-c11" class="clip" data-start="23.44" data-duration="0.2" data-track-index="26" data-volume="0.5" src="assets/sfx/impactWood_medium_001.ogg"></audio>
      <audio id="s-stamp" class="clip" data-start="25.36" data-duration="0.3" data-track-index="27" data-volume="0.7" src="assets/sfx/impactSoft_heavy_001.ogg"></audio>
      <audio id="s-sig" class="clip" data-start="25.4" data-duration="2.8" data-track-index="28" data-volume="0.6" src="assets/sfx/sig-full.wav"></audio>
    </div>
    <script>
      const main = gsap.timeline({ paused: true });
      // slow handheld-style push on every shot
      main.fromTo("#v-h1-hands", { scale: 1.0 }, { scale: 1.06, duration: 3.85, ease: "none" }, 0.0);
      main.fromTo("#v-h2-upset", { scale: 1.0 }, { scale: 1.06, duration: 3.75, ease: "none" }, 3.85);
      main.fromTo("#v-q1-woman", { scale: 1.0 }, { scale: 1.06, duration: 2.5, ease: "none" }, 7.6);
      main.fromTo("#v-q1-hand", { scale: 1.0 }, { scale: 1.06, duration: 2.53, ease: "none" }, 10.1);
      main.fromTo("#v-q2-frustrated", { scale: 1.0 }, { scale: 1.06, duration: 6.99, ease: "none" }, 12.63);
      main.fromTo("#v-a1-walk", { scale: 1.0 }, { scale: 1.06, duration: 3.18, ease: "none" }, 19.62);
      main.fromTo("#v-a1-typing", { scale: 1.0 }, { scale: 1.06, duration: 2.51, ease: "none" }, 22.8);
      main.fromTo("#v-end-desk", { scale: 1.0 }, { scale: 1.06, duration: 4.69, ease: "none" }, 25.31);
      window.__timelines["main"] = main;
    </script>
  </body>
</html>
