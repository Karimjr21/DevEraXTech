<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DevEraXTech: New Quest</title>
<link rel="stylesheet" href="kit/reel-kit.css">
<link rel="stylesheet" href="kit/fonts2.css">
<style>
  /* FANTASY RPG: parchment map, quest scroll, hero card, skill tree, loot chest, level-up */
  :root { --ink: #3a2512; --parch: #ead7a8; }
  #stage { background: #1b120a; color: var(--ink); }
  .med { font-family: 'Medieval', 'Playfair', serif; }
  #map { background: radial-gradient(ellipse at 50% 45%, #f1e2b8 0%, #e2cc93 60%, #b99a5c 100%); }
  #mapInk { opacity: .35; }
  #frame { left: 24px; right: 24px; top: 24px; bottom: 24px; border: 6px double #7a5a2a; border-radius: 8px; }
  /* scroll */
  #scroll { left: 90px; right: 90px; top: 420px; height: 0; background: var(--parch); overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,.35); border-left: 10px solid #c9ad72; border-right: 10px solid #c9ad72; }
  #rodT, #rodB { position: absolute; left: 70px; right: 70px; height: 50px; border-radius: 25px; background: linear-gradient(#8a5a2a, #4a2a10); }
  #sc1 { top: 470px; font-size: 76px; } #sc2 { top: 620px; left: 140px; right: 140px; font-size: 100px; line-height: 1.05; }
  /* hero card */
  #banner { top: 170px; font-size: 76px; }
  #hero { left: 120px; top: 330px; width: 840px; height: 1180px; background: #f3e4bd; border: 10px solid #7a5a2a; border-radius: 26px; box-shadow: 0 30px 60px rgba(0,0,0,.4); padding: 50px; }
  #portrait { width: 360px; height: 360px; margin: 0 auto; border-radius: 50%; border: 10px solid #b8912a; background: radial-gradient(circle, #3a2a14, #1a120a); display: grid; place-items: center; }
  #portrait img { width: 260px; }
  #hname { text-align: center; font-size: 96px; margin-top: 26px; }
  .hf { font-size: 58px; margin-top: 22px; display: flex; justify-content: space-between; border-bottom: 3px dotted rgba(58,37,18,.4); padding-bottom: 10px; }
  .hf b { color: #7a1f0e; font-weight: 400; }
  /* skill tree */
  #stT { top: 200px; font-size: 96px; }
  #tree { left: 0; top: 0; width: 1080px; height: 1920px; }
  .node { position: absolute; width: 230px; height: 230px; margin: -115px 0 0 -115px; border-radius: 50%; background: #cdb98a; border: 8px solid #7a5a2a; display: grid; place-items: center; font-size: 100px; filter: grayscale(1) opacity(.55); }
  .node.on { background: radial-gradient(circle, #fff2b0, #d4af37); border-color: #fff; filter: none; box-shadow: 0 0 60px rgba(245,213,115,.9); }
  .nlbl { position: absolute; width: 360px; margin-left: -180px; text-align: center; font-size: 50px; }
  .plus { position: absolute; font-size: 60px; color: #2e7d32; }
  /* loot */
  #chest { left: 340px; top: 1120px; width: 400px; height: 300px; }
  #lid { position: absolute; left: 0; right: 0; top: 0; height: 110px; background: linear-gradient(#8a5a2a, #5a3a18); border: 8px solid #3a2512; border-radius: 60px 60px 8px 8px; transform-origin: 50% 100%; }
  #box { position: absolute; left: 0; right: 0; top: 100px; bottom: 0; background: linear-gradient(#7a4a20, #4a2a10); border: 8px solid #3a2512; border-radius: 8px; }
  #box::after { content: ''; position: absolute; left: 170px; top: 0; width: 44px; height: 70px; background: #d4af37; border-radius: 0 0 10px 10px; }
  #item { left: 190px; top: 260px; width: 700px; padding: 30px; background: #1d1430; border: 8px solid #a26bff; border-radius: 22px; color: #fff; text-align: center; }
  #item img { width: 100%; border-radius: 12px; }
  #item .r { font-size: 40px; letter-spacing: .1em; color: #c9a2ff; }
  #item .n { font-size: 74px; margin: 14px 0; }
  #item .s { font-size: 44px; color: #e8dcff; line-height: 1.35; }
  /* level up */
  #lvl { top: 520px; font-size: 180px; color: #b8912a; text-shadow: 0 6px 0 #3a2512; }
  #xp { left: 120px; right: 120px; top: 860px; height: 90px; border: 8px solid var(--ink); border-radius: 50px; background: #cdb98a; overflow: hidden; }
  #xp i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2e7d32, #8bc34a); }
  #xpt { top: 990px; font-size: 56px; line-height: 1.4; }
  /* CTA */
  #c1 { top: 400px; font-size: 130px; }
  #seal { left: 400px; top: 620px; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #d9453a, #8e1c14 70%); display: grid; place-items: center; box-shadow: 0 10px 20px rgba(0,0,0,.4); }
  #seal img { width: 180px; filter: brightness(.35) sepia(1) hue-rotate(-30deg) saturate(3); }
  .btn { top: 1000px; width: 380px; padding: 30px 0; text-align: center; font-size: 60px; border: 8px solid var(--ink); border-radius: 18px; }
  #acc { left: 110px; background: var(--gold-grad); }
  #dec { right: 110px; background: #cdb98a; color: rgba(58,37,18,.5); text-decoration: line-through; }
  #eUrl { top: 1210px; color: var(--ink); } #eIg { top: 1290px; color: #6a4a22; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="map" class="layer"></div>
    <svg id="mapInk" class="layer" viewBox="0 0 1080 1920" fill="none" stroke="#6a4a22" stroke-width="5" stroke-dasharray="14 14">
      <path d="M80 1700 C300 1500 200 1200 480 1100 S 900 800 760 400 S 400 200 300 120"/><path d="M1000 1800 C800 1600 900 1300 700 1250"/>
      <circle cx="880" cy="1560" r="90" stroke-dasharray="0"/><path d="M880 1470 L880 1650 M790 1560 L970 1560" stroke-dasharray="0"/><text x="865" y="1455" font-size="40" fill="#6a4a22" stroke="none">N</text></svg>
    <div id="frame" class="abs"></div>
    <section id="s1" class="scene">
      <div id="scroll" class="abs"></div><div id="rodT" class="abs"></div><div id="rodB" class="abs"></div>
      <div id="sc1" class="abs cx med">⚔️ New quest unlocked</div>
      <div id="sc2" class="abs cx med">Build a website worthy of legends</div>
    </section>
    <section id="s2" class="scene">
      <div id="banner" class="abs cx med">A hero joins your party!</div>
      <div id="hero" class="abs med"><div id="portrait"><img src="assets/logo.png" alt=""></div><div id="hname">DevEraXTech</div><div id="hfs"></div></div>
    </section>
    <section id="s3" class="scene"><div id="stT" class="abs cx med">Skill tree</div><svg id="tree" class="abs"></svg><div id="nodes"></div></section>
    <section id="s4" class="scene">
      <div id="chest" class="abs"><div id="box"></div><div id="lid"></div></div>
      <div id="item" class="abs med"><div class="r">✦ LEGENDARY ITEM ✦</div><img src="assets/nilora-estates-real-estate-website.webp" alt=""><div class="n">Nilora Estates</div><div class="s">+ MERN stack<br>+ 3 role-based dashboards</div></div>
    </section>
    <section id="s5" class="scene">
      <div id="lvl" class="abs cx med">LEVEL UP!</div>
      <div id="xp" class="abs"><i></i></div>
      <div id="xpt" class="abs cx med">10+ quests completed<br>7 kingdoms · 3 tongues</div>
    </section>
    <section id="s6" class="scene">
      <div id="c1" class="abs cx med">Accept quest?</div>
      <div id="seal" class="abs"><img src="assets/logo.png" alt=""></div>
      <div id="acc" class="abs btn med">Accept ⚔️</div><div id="dec" class="abs btn med">Decline</div>
      <div id="eUrl" class="abs cx url med">deveraxtech.com</div>
      <div id="eIg" class="abs cx ig">@deveraxtech</div>
    </section>
  </div>
</div>

<script src="kit/reel-kit.js"></script>
<script>
const { seg, easeOut, easeInOut, back, decay, slam, pop, rise, win, show, $ } = kit;
const HF = [['Class', 'Web Studio'], ['Level', '99'], ['Home', 'Cairo, Egypt'], ['Tongues', 'AR · EN · DE']];
$('#hfs').innerHTML = HF.map(([k, v]) => `<div class="hf"><span>${k}</span><b>${v}</b></div>`).join('');
const NODES = [[540, 520, '🎨', 'Custom Design'], [260, 860, '🛡️', 'Security'], [820, 860, '⚡', 'Speed'], [300, 1280, '🔎', 'SEO'], [780, 1280, '🗣️', 'Multilingual']];
const EDGES = [[0, 1], [0, 2], [1, 3], [2, 4]];
$('#tree').innerHTML = EDGES.map(([a, b], i) => `<line id="e${i}" x1="${NODES[a][0]}" y1="${NODES[a][1]}" x2="${NODES[b][0]}" y2="${NODES[b][1]}" stroke="#7a5a2a" stroke-width="12" stroke-linecap="round"/>`).join('');
$('#nodes').innerHTML = NODES.map(([x, y, e, l]) => `<div class="node emoji" style="left:${x}px;top:${y}px">${e}</div><div class="nlbl med" style="left:${x}px;top:${y + 130}px">${l}</div><div class="plus med" style="left:${x + 80}px;top:${y - 140}px">+1</div>`).join('');
const nodeAt = (i) => 6.5 + i * .75;

const chrome = kit.setup({
  duration: 21, bpm: 240, beatFrom: 1.5, beatTo: 20.25, goldFrom: 99,
  look: { gold: false, progress: false, handle: false, vignette: true, grain: .1, pump: 0, shake: .5, sparks: '245,213,115' },
  hits: [{ t: 10.5, amp: 16 }, { t: 13.5, amp: 18 }], bursts: [12, 13.5], whiteFlashes: [],
});

window.render = function (t) {
  chrome(t);
  // 1: quest scroll unrolls
  show($('#s1'), win(t, 0, 3) * (1 - seg(t, 2.8, 3)));
  const h = easeOut(seg(t, 0, .7)) * 560;
  $('#scroll').style.height = h + 'px';
  $('#rodT').style.top = '395px'; $('#rodB').style.top = (395 + h) + 'px';
  const a1 = pop(t, .4, .3); show($('#sc1'), a1.o, `scale(${a1.s})`);
  const a2 = rise(t, 1.2, .5); show($('#sc2'), a2); $('#sc2').style.clipPath = `inset(0 ${(1 - a2) * 100}% 0 0)`;

  // 2: hero joins
  show($('#s2'), win(t, 3, 6) * (1 - seg(t, 5.8, 6)));
  const bn = slam(t, 3, .25); show($('#banner'), bn.o, `scale(${bn.s})`);
  const hc = easeOut(seg(t, 3, 3.5)); $('#hero').style.transform = `translateY(${(1 - hc) * 1500}px) rotate(${(1 - hc) * 6}deg)`;
  [...$('#hfs').children].forEach((f, i) => { const p = rise(t, 3.6 + i * .5, .3); show(f, p, `translateX(${(1 - p) * -80}px)`); });

  // 3: skill tree
  show($('#s3'), win(t, 6, 10.5) * (1 - seg(t, 10.3, 10.5)));
  show($('#stT'), rise(t, 6, .3));
  const ns = document.querySelectorAll('.node'), ls = document.querySelectorAll('.nlbl'), ps = document.querySelectorAll('.plus');
  NODES.forEach((_, i) => {
    const a = nodeAt(i), on = t >= a;
    ns[i].classList.toggle('on', on);
    ns[i].style.transform = `scale(${1 + decay(t, a, 6) * .3})`;
    show(ls[i], rise(t, 6.2, .4));
    const pk = seg(t, a, a + .8); show(ps[i], pk > 0 && pk < 1 ? 1 - pk : 0, `translateY(${-pk * 90}px)`);
  });
  EDGES.forEach(([a, b], i) => { $('#e' + i).setAttribute('stroke', t >= nodeAt(b) ? '#d4af37' : '#7a5a2a'); });

  // 4: loot
  show($('#s4'), win(t, 10.5, 13.5) * (1 - seg(t, 13.3, 13.5)));
  const lid = easeOut(seg(t, 10.5, 10.9)); $('#lid').style.transform = `rotateX(${lid * 70}deg) translateY(${-lid * 40}px)`;
  $('#chest').style.transform = `rotate(${Math.sin(t * 30) * 3 * decay(t, 10.5, 4)}deg)`;
  const it = easeOut(seg(t, 11.2, 11.8)); show($('#item'), it, `translateY(${(1 - it) * 700}px) scale(${.5 + it * .5})`);
  const leg = seg(t, 12, 12.4);
  $('#item').style.borderColor = leg >= 1 ? '#f5d573' : '#a26bff';
  $('#item').style.boxShadow = `0 0 ${leg * 100}px rgba(245,213,115,${leg})`;
  $('#item .r').style.color = leg >= 1 ? '#f5d573' : '#c9a2ff';
  show($('#item .s'), rise(t, 12.4, .4));

  // 5: level up
  show($('#s5'), win(t, 13.5, 16.5) * (1 - seg(t, 16.3, 16.5)));
  const lv = slam(t, 13.5, .25); show($('#lvl'), lv.o, `scale(${lv.s})`);
  $('#xp i').style.width = easeInOut(seg(t, 13.6, 15)) * 100 + '%';
  show($('#xpt'), rise(t, 15, .4));

  // 6: accept?
  show($('#s6'), win(t, 16.5, 21));
  const c = slam(t, 16.5, .25); show($('#c1'), c.o, `scale(${c.s})`);
  const sl = seg(t, 16.8, 17.1); show($('#seal'), sl > 0 ? 1 : 0, `scale(${1.8 - back(sl) * .8}) rotate(${(1 - sl) * 40}deg)`);
  const b = pop(t, 17.5, .3); show($('#acc'), b.o, `scale(${b.s * (1 + Math.max(0, Math.sin((t - 17.8) * 5)) * .04)})`); show($('#dec'), b.o * .8, `scale(${b.s})`);
  show($('#eUrl'), rise(t, 18.2, .4)); show($('#eIg'), rise(t, 18.4, .4));
};
kit.start();
</script>
</body>
</html>
