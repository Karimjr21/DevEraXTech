<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DevEraXTech: New Sheriff in Town</title>
<link rel="stylesheet" href="kit/reel-kit.css">
<link rel="stylesheet" href="kit/fonts2.css">
<style>
  /* WESTERN: sepia desert, tumbleweed, wanted poster, high-noon showdown, sheriff badge */
  #stage { background: #2a1608; }
  .rye { font-family: 'Rye', 'Playfair', serif; }
  #sky { background: linear-gradient(180deg, #f3b562 0%, #e0873e 45%, #b8582a 62%, #7a3a1a 63%, #a4652e 80%, #6a3a18 100%); }
  #sun { left: 620px; top: 700px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, #fff1c2, #ffd27a 60%, rgba(255,200,100,0) 72%); }
  .mesa { position: absolute; bottom: 700px; background: #6d3417; }
  #sepia { background: rgba(120,70,20,.18); mix-blend-mode: multiply; }
  #tumble { left: 0; top: 1330px; width: 180px; height: 180px; }
  #dust { background: radial-gradient(ellipse at 50% 100%, rgba(230,180,120,.35), transparent 60%); }
  #h1 { top: 330px; font-size: 64px; color: #2a1608; white-space: nowrap; } #h2 { top: 440px; font-size: 96px; color: #7a1f0e; }
  /* poster */
  #poster { left: 150px; top: 200px; width: 780px; height: 1180px; background: #ecd9ac; box-shadow: 0 30px 60px rgba(0,0,0,.5);
    background-image: radial-gradient(ellipse at 30% 30%, rgba(255,255,255,.35), transparent 60%), radial-gradient(ellipse at 80% 90%, rgba(120,70,20,.3), transparent 50%);
    clip-path: polygon(0 2%, 4% 0, 30% 1%, 60% 0, 96% 1%, 100% 4%, 99% 40%, 100% 70%, 98% 97%, 95% 100%, 60% 99%, 20% 100%, 2% 98%, 0 70%, 1% 30%); padding: 50px 60px; text-align: center; color: #3a1d0a; }
  #poster .w { font-size: 146px; line-height: 1; }
  #poster .pic { margin: 26px auto; width: 420px; height: 330px; background: #b9a57a; border: 6px solid #3a1d0a; padding: 20px; display: grid; grid-template-rows: 60px 1fr 40px 40px; gap: 14px; }
  #poster .pic i { background: #8d7c58; border-radius: 6px; }
  #poster .l { font-size: 64px; line-height: 1.15; margin-top: 12px; }
  .nail { position: absolute; top: 20px; width: 26px; height: 26px; border-radius: 50%; background: #555; }
  /* showdown */
  .guy { position: absolute; top: 900px; width: 300px; height: 620px; }
  #tom { left: 60px; } #dx { right: 60px; }
  .nm { position: absolute; top: 1540px; font-size: 44px; color: #fff3d6; text-shadow: 0 3px 0 #3a1d0a; }
  #clock { left: 390px; top: 300px; width: 300px; height: 300px; }
  #eyes { left: 0; right: 0; top: 780px; height: 360px; background: #1a0c04; display: flex; }
  #eyes div { flex: 1; display: grid; place-items: center; font-size: 150px; }
  #draw { top: 700px; font-size: 230px; color: #fff3d6; text-shadow: 0 8px 0 #7a1f0e, 0 0 40px rgba(0,0,0,.5); }
  #beaten { left: 60px; top: 1200px; padding: 10px 24px; border: 8px solid #7a1f0e; color: #7a1f0e; font-size: 60px; background: rgba(236,217,172,.9); }
  /* badge */
  #badge { left: 290px; top: 250px; width: 500px; height: 500px; }
  #sher { top: 800px; font-size: 90px; color: #2a1608; }
  .trait { left: 120px; right: 60px; font-size: 56px; color: #2a1608; font-family: 'Rye', serif; }
  #eBtn { left: 180px; right: 180px; top: 900px; padding: 40px 0; text-align: center; background: linear-gradient(#8a5a2a, #5b3a18); color: #ffe6b0; font-size: 60px; border: 6px solid #3a1d0a; border-radius: 12px; box-shadow: 0 12px 0 #2a1608; }
  #c1 { top: 400px; font-size: 130px; color: #2a1608; }
  #c2 { top: 600px; font-size: 56px; color: #5a2a10; }
  #eUrl { top: 1120px; color: #2a1608; } #eIg { top: 1200px; color: #5a2a10; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="sky" class="layer"></div>
    <div id="sun" class="abs"></div>
    <div class="mesa" style="left:-40px;width:420px;height:230px;border-radius:30px 60px 0 0"></div>
    <div class="mesa" style="left:700px;width:460px;height:170px;border-radius:50px 20px 0 0"></div>
    <div id="dust" class="layer"></div>
    <svg id="tumble" class="abs" viewBox="0 0 180 180"><g fill="none" stroke="#6b4a22" stroke-width="5">
      <circle cx="90" cy="90" r="80"/><path d="M20 70 C60 20 130 40 160 90 M30 130 C70 80 120 150 160 110 M60 20 C40 90 80 150 130 170 M140 30 C100 70 110 130 60 170 M15 100 C60 100 110 60 170 70"/></g></svg>
    <section id="s1" class="scene">
      <div id="h1" class="abs cx rye">This town ain’t big enough</div>
      <div id="h2" class="abs cx rye">for two websites 🤠</div>
    </section>
    <section id="s2" class="scene">
      <div id="poster" class="abs rye"><span class="nail" style="left:40px"></span><span class="nail" style="right:40px"></span>
        <div class="w">WANTED</div><div class="pic"><i></i><i></i><i></i><i></i></div>
        <div class="l" id="pl1">Slow template websites</div><div class="l" id="pl2" style="font-size:50px">For: losing customers</div><div class="l" id="pl3" style="font-size:50px">Reward: a better website</div></div>
    </section>
    <section id="s3" class="scene">
      <svg id="clock" class="abs" viewBox="0 0 300 300"><circle cx="150" cy="150" r="140" fill="#ecd9ac" stroke="#3a1d0a" stroke-width="12"/>
        <text x="150" y="70" text-anchor="middle" font-family="Rye" font-size="44" fill="#3a1d0a">XII</text>
        <line id="hHand" x1="150" y1="150" x2="150" y2="70" stroke="#3a1d0a" stroke-width="12" stroke-linecap="round"/>
        <line id="mHand" x1="150" y1="150" x2="150" y2="40" stroke="#7a1f0e" stroke-width="7" stroke-linecap="round"/></svg>
      <svg id="tom" class="guy" viewBox="0 0 300 620"><g id="tomBody" fill="#5f5a54">
        <rect x="95" y="190" width="110" height="230" rx="30"/><rect x="100" y="410" width="40" height="200" rx="16"/><rect x="160" y="410" width="40" height="200" rx="16"/>
        <rect x="60" y="210" width="36" height="170" rx="18"/><rect x="204" y="210" width="36" height="170" rx="18"/><circle cx="150" cy="140" r="52"/></g>
        <g id="tomHat" fill="#48433e"><ellipse cx="150" cy="96" rx="110" ry="20"/><path d="M100 96 C100 30 200 30 200 96 Z"/></g></svg>
      <svg id="dx" class="guy" viewBox="0 0 300 620"><defs><linearGradient id="gg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7dc85"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#9c7a1f"/></linearGradient></defs>
        <g fill="url(#gg)"><rect x="95" y="190" width="110" height="230" rx="30"/><rect x="100" y="410" width="40" height="200" rx="16"/><rect x="160" y="410" width="40" height="200" rx="16"/>
        <rect x="60" y="210" width="36" height="170" rx="18"/><rect x="204" y="210" width="36" height="170" rx="18"/><circle cx="150" cy="140" r="52"/>
        <ellipse cx="150" cy="96" rx="110" ry="20"/><path d="M100 96 C100 30 200 30 200 96 Z"/></g>
        <image href="assets/logo.png" x="105" y="240" width="90" height="70"/></svg>
      <div class="nm rye" style="left:70px">Template Tom</div><div class="nm rye" style="right:80px">DevEraXTech</div>
      <div id="eyes" class="abs"><div class="emoji">😠</div><div class="emoji">😎</div></div>
      <div id="draw" class="abs cx rye">DRAW!</div>
      <div id="beaten" class="abs rye">DEFEATED 💨</div>
    </section>
    <section id="s4" class="scene">
      <svg id="badge" class="abs" viewBox="0 0 500 500"><defs><linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset=".45" stop-color="#d4af37"/><stop offset="1" stop-color="#8a6a18"/></linearGradient></defs>
        <polygon points="250,20 305,175 470,175 337,275 385,440 250,340 115,440 163,275 30,175 195,175" fill="url(#bg2)" stroke="#6d5212" stroke-width="10"/>
        <circle cx="250" cy="255" r="95" fill="#2a1608"/><image href="assets/logo.png" x="175" y="205" width="150" height="100"/></svg>
      <div id="sher" class="abs cx rye">New sheriff in town</div>
      <div id="traits"></div>
    </section>
    <section id="s5" class="scene">
      <div id="c1" class="abs cx rye">Ride with us 🐎</div>
      <div id="c2" class="abs cx rye">Your website. Our studio. Cairo.</div>
      <div id="eBtn" class="abs rye">Request a meeting →</div>
      <div id="eUrl" class="abs cx url rye">deveraxtech.com</div>
      <div id="eIg" class="abs cx ig">@deveraxtech</div>
    </section>
    <div id="sepia" class="layer"></div>
  </div>
</div>

<script src="kit/reel-kit.js"></script>
<script>
const { seg, easeOut, easeInOut, back, decay, slam, pop, rise, win, show, $ } = kit;
const B = .625, at = (b) => b * B;
const TRAITS = ['★ Custom design', '★ Secure from day one', '★ Fast on every screen', '★ Speaks Arabic, English &amp; German'];
$('#traits').innerHTML = TRAITS.map((s, i) => `<div class="abs trait" style="top:${960 + i * 110}px">${s}</div>`).join('');

const chrome = kit.setup({
  duration: 24, bpm: 96, beatFrom: at(4), beatTo: at(37), goldFrom: 99,
  look: { gold: false, progress: false, handle: false, grain: .16, pump: 0, shake: .7, sparks: '255,220,140' },
  hits: [{ t: at(4), amp: 20 }, { t: at(18), amp: 34 }, { t: at(22), amp: 14 }], bursts: [at(22)], whiteFlashes: [at(18)],
});

window.render = function (t) {
  chrome(t);
  // tumbleweed rolls across the first seconds and again at the end
  const tw = ((t * 260) % 1500) - 200;
  $('#tumble').style.transform = `translate(${tw}px, ${-Math.abs(Math.sin(t * 5)) * 60}px) rotate(${t * 300}deg)`;
  $('#tumble').style.opacity = t < at(10) || t > at(30) ? 1 : 0;

  // hook
  show($('#s1'), win(t, 0, at(4)) * (1 - seg(t, at(3.6), at(4))));
  let k = slam(t, .2, .3); show($('#h1'), k.o, `scale(${k.s})`);
  k = slam(t, 1.25, .3); show($('#h2'), k.o, `scale(${k.s})`);

  // wanted poster
  show($('#s2'), win(t, at(4), at(10)));
  const ps = seg(t, at(4), at(4) + .25);
  $('#poster').style.transform = `scale(${1.6 - back(ps) * .6}) rotate(${-3 + (1 - ps) * 10}deg)`;
  $('#poster').style.opacity = ps > 0 ? 1 : 0;
  [['#pl1', 5], ['#pl2', 6], ['#pl3', 7]].forEach(([id, b]) => { const p = pop(t, at(b), .25); show($(id), p.o, `scale(${p.s})`); });

  // showdown
  show($('#s3'), win(t, at(10), at(22)));
  show($('#clock'), rise(t, at(10), .3) * (1 - seg(t, at(17.5), at(18))));
  $('#hHand').setAttribute('transform', `rotate(${-30 + easeOut(seg(t, at(10), at(14))) * 30} 150 150)`);
  $('#mHand').setAttribute('transform', `rotate(${-180 + easeOut(seg(t, at(10), at(14))) * 180} 150 150)`);
  const walk = easeOut(seg(t, at(10), at(12)));
  $('#tom').style.transform = `translateX(${(1 - walk) * -400}px)`;
  $('#dx').style.transform = `translateX(${(1 - walk) * 400}px)`;
  document.querySelectorAll('.nm').forEach((n, i) => show(n, rise(t, at(10.5 + i), .4)));
  const ey = win(t, at(15), at(18));
  show($('#eyes'), ey, `scaleY(${easeOut(seg(t, at(15), at(15) + .2))})`);
  const dr = slam(t, at(18), .2); show($('#draw'), dr.o * (t < at(20) ? 1 : 0), `scale(${dr.s})`);
  const fall = easeInOut(seg(t, at(18.6), at(19.8)));
  $('#tomBody').setAttribute('transform', `rotate(${-fall * 80} 150 600)`);
  $('#tomHat').setAttribute('transform', `translate(${-fall * 200}, ${-Math.sin(fall * Math.PI) * 300 + fall * 380}) rotate(${-fall * 400} 150 80)`);
  const bt = pop(t, at(19.2), .3); show($('#beaten'), bt.o, `scale(${bt.s}) rotate(-8deg)`);

  // sheriff
  show($('#s4'), win(t, at(22), at(30)));
  const bd = seg(t, at(22), at(22) + .4); show($('#badge'), bd > 0 ? 1 : 0, `scale(${.3 + back(bd) * .7}) rotate(${(1 - easeOut(bd)) * -200 + Math.sin(t * 2) * 3}deg)`);
  const sh = pop(t, at(22.4), .35); show($('#sher'), sh.o, `scale(${sh.s})`);
  [...$('#traits').children].forEach((el, i) => { const p = easeOut(seg(t, at(24 + i), at(24.6 + i))); show(el, p, `translateX(${(1 - p) * -200}px)`); });

  // CTA
  show($('#s5'), win(t, at(30), 24));
  k = slam(t, at(30), .3); show($('#c1'), k.o, `scale(${k.s})`);
  show($('#c2'), rise(t, at(30.8), .5));
  const eb = seg(t, at(31.5), at(31.5) + .4); show($('#eBtn'), eb > 0 ? 1 : 0, `translateY(${(1 - back(eb)) * -400}px) rotate(${Math.sin((t - at(31.5)) * 6) * 4 * Math.exp(-(t - at(31.5)) * 2)}deg)`);
  show($('#eUrl'), rise(t, at(32.5), .4)); show($('#eIg'), rise(t, at(33), .4));
};
kit.start();
</script>
</body>
</html>
