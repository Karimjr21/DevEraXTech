<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DevEraXTech: Your Fortune</title>
<link rel="stylesheet" href="kit/reel-kit.css">
<link rel="stylesheet" href="kit/fonts2.css">
<style>
  /* TAROT: velvet, candlelight, crystal ball, three cards flipping on the beat */
  :root { --vel: #2a0f3d; --gold: #e8c46a; }
  #stage { background: #12051c; }
  #velvet { background: radial-gradient(ellipse at 50% 45%, #4a1a6b 0%, #2a0f3d 45%, #0d0314 100%); }
  #stars i { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff3c4; }
  .cz { font-family: 'CinzelDeco', 'Playfair', serif; font-weight: 700; color: var(--gold); text-shadow: 0 0 30px rgba(232,196,106,.5); }
  #h1 { top: 300px; font-size: 82px; } #h2 { top: 410px; font-size: 82px; }
  #ball { left: 340px; top: 1200px; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(180,120,255,.6) 20%, rgba(90,30,160,.7) 55%, rgba(20,0,40,.9) 80%); box-shadow: 0 0 120px rgba(170,110,255,.7); }
  #base { left: 380px; top: 1560px; width: 320px; height: 110px; border-radius: 20px 20px 60px 60px; background: linear-gradient(#8a6a2a, #3a2a10); }
  .candle { position: absolute; top: 1420px; width: 60px; height: 240px; background: linear-gradient(90deg, #efe2c4, #fff8e6, #d9c9a6); border-radius: 8px; }
  .candle .fl { position: absolute; left: 12px; top: -80px; width: 36px; height: 76px; border-radius: 50% 50% 45% 45%; background: radial-gradient(ellipse at 50% 70%, #fff6c8, #ffb347 50%, rgba(255,120,40,0) 75%); filter: blur(1px); transform-origin: 50% 100%; }
  .candle .gl { position: absolute; left: -120px; top: -200px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(255,190,90,.35), transparent 70%); }
  /* cards */
  .card { position: absolute; top: 640px; width: 300px; height: 520px; perspective: 1600px; }
  .card .in { position: absolute; inset: 0; transform-style: preserve-3d; }
  .card .face, .card .backf { position: absolute; inset: 0; border-radius: 22px; backface-visibility: hidden; border: 6px solid var(--gold); }
  .card .backf { background: repeating-linear-gradient(45deg, #3a1458 0 16px, #2a0f3d 16px 32px); display: grid; place-items: center; }
  .card .backf span { font-size: 120px; color: var(--gold); }
  .card .face { transform: rotateY(180deg); background: linear-gradient(170deg, #fbf1d6, #e9d6a6); color: #3a1458; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  .card .num { font-family: 'CinzelDeco', serif; font-size: 28px; font-weight: 700; }
  .card .art { flex: 1; display: grid; place-items: center; width: 100%; }
  .card .nm { font-family: 'CinzelDeco', serif; font-weight: 700; font-size: 32px; text-align: center; line-height: 1.1; }
  .tpl { display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; }
  .tpl i { height: 80px; background: #a59aa8; border-radius: 6px; }
  #cap { left: 170px; right: 170px; top: 1210px; text-align: center; font-family: 'Playfair', serif; font-style: italic; font-size: 64px; color: #f6e7ff; text-shadow: 0 0 20px rgba(0,0,0,.6); }
  #never { left: 170px !important; right: 170px !important; top: 1560px; font-size: 70px; }
  /* CTA */
  #c1 { top: 380px; font-size: 84px; line-height: 1.2; }
  #eLogo { left: 390px; top: 640px; width: 300px; filter: drop-shadow(0 0 40px rgba(232,196,106,.7)); }
  #eBtn { left: 170px; right: 170px; top: 1020px; padding: 36px 0; text-align: center; border: 4px solid var(--gold); border-radius: 999px; color: var(--gold); font-family: 'CinzelDeco', serif; font-weight: 700; font-size: 48px; background: rgba(42,15,61,.7); box-shadow: 0 0 40px rgba(232,196,106,.4); }
  #eUrl { top: 1210px; color: #f6e7ff; } #eIg { top: 1290px; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="velvet" class="layer"></div>
    <div id="stars" class="layer"></div>
    <div class="candle" style="left:90px"><i class="gl"></i><i class="fl"></i></div>
    <div class="candle" style="left:930px"><i class="gl"></i><i class="fl"></i></div>
    <section id="s1" class="scene">
      <div id="h1" class="abs cx cz">Let’s read your</div>
      <div id="h2" class="abs cx cz">website’s fortune</div>
      <div id="ball" class="abs"></div><div id="base" class="abs"></div>
    </section>
    <section id="s2" class="scene">
      <div id="cards"></div>
      <div id="cap" class="abs"></div>
      <div id="never" class="abs cx cz">The cards never lie ✨</div>
    </section>
    <section id="s3" class="scene">
      <div id="c1" class="abs cx cz">Your future is<br>one call away</div>
      <img id="eLogo" class="abs" src="assets/logo.png" alt="">
      <div id="eBtn" class="abs">Request a meeting</div>
      <div id="eUrl" class="abs cx url">deveraxtech.com</div>
      <div id="eIg" class="abs cx ig">@deveraxtech</div>
    </section>
  </div>
</div>

<script src="kit/reel-kit.js"></script>
<script>
const { seg, easeOut, easeInOut, back, decay, pop, rise, win, show, rng, $ } = kit;
const B = 60 / 70, at = (b) => b * B;
const CARDS = [
  { x: 60, num: 'I · The Past', nm: 'The<br>Template', art: '<div class="tpl">' + '<i></i>'.repeat(6) + '</div>', cap: 'Looked like everyone else.', flip: at(5) },
  { x: 390, num: 'II · The Present', nm: 'The Lost<br>Visitor', art: '<div class="emoji" style="font-size:150px">🚶‍♂️💨</div>', cap: 'Slow pages. Nowhere to click.', flip: at(10) },
  { x: 720, num: 'III · The Future', nm: 'The<br>Studio', art: '<img src="assets/logo.png" style="width:220px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))">', cap: 'DevEraXTech. Custom, secure, fast. Yours.', flip: at(15) },
];
$('#cards').innerHTML = CARDS.map(c => `<div class="card" style="left:${c.x}px"><div class="in"><div class="backf"><span>✦</span></div>
  <div class="face"><div class="num">${c.num}</div><div class="art">${c.art}</div><div class="nm">${c.nm}</div></div></div></div>`).join('');
const sr = rng(8);
$('#stars').innerHTML = Array.from({ length: 70 }, () => `<i style="left:${sr() * 1080}px;top:${sr() * 1920}px"></i>`).join('');
const twk = Array.from({ length: 70 }, () => sr() * 6);

const chrome = kit.setup({
  duration: 24, bpm: 70, beatFrom: 99, beatTo: 99, goldFrom: 99,
  look: { gold: false, progress: false, handle: false, grain: .07, pump: 0, shake: .4, sparks: '232,196,106' },
  hits: [{ t: at(15), amp: 16 }], bursts: [at(15), at(22)], whiteFlashes: [],
});

window.render = function (t) {
  chrome(t);
  [...$('#stars').children].forEach((s, i) => { s.style.opacity = .3 + .7 * Math.abs(Math.sin(t * 1.5 + twk[i])); });
  document.querySelectorAll('.fl').forEach((f, i) => { f.style.transform = `scale(${1 + Math.sin(t * 17 + i) * .08}, ${1 + Math.sin(t * 23 + i * 2) * .12}) rotate(${Math.sin(t * 9 + i) * 4}deg)`; });

  // hook
  show($('#s1'), win(t, 0, at(3)) * (1 - seg(t, at(2.6), at(3))));
  const fade = (el, a) => { const k = rise(t, a, .8); show(el, k); el.style.filter = `blur(${(1 - k) * 12}px)`; el.style.letterSpacing = `${(1 - k) * .2}em`; };
  fade($('#h1'), .2); fade($('#h2'), .9);
  $('#ball').style.boxShadow = `0 0 ${100 + Math.sin(t * 3) * 40}px rgba(170,110,255,.8)`;
  $('#ball').style.transform = `scale(${1 + Math.sin(t * 2) * .02})`;

  // cards
  show($('#s2'), win(t, at(2.6), at(22)) * (1 - seg(t, at(21.6), at(22))));
  const fut = easeInOut(seg(t, at(15.6), at(16.6)));
  document.querySelectorAll('.card').forEach((el, i) => {
    const c = CARDS[i], ent = easeOut(seg(t, at(2.6) + i * .2, at(3.4) + i * .2));
    let tx = (1 - ent) * (540 - c.x - 150), ty = (1 - ent) * 900, sc = 1, op = ent;
    if (i < 2) op *= 1 - fut * .75;
    else { tx += fut * (390 - 720); ty += fut * -40; sc = 1 + fut * .45; }
    el.style.transform = `translate(${tx}px, ${ty}px) scale(${sc}) rotate(${(1 - ent) * (i - 1) * 20}deg)`;
    el.style.opacity = op; el.style.zIndex = i === 2 ? 2 : 1;
    el.querySelector('.in').style.transform = `rotateY(${easeInOut(seg(t, c.flip, c.flip + .6)) * 180}deg)`;
    el.querySelector('.face').style.boxShadow = i === 2 ? `0 0 ${decay(t, c.flip + .6, 1.5) * 120 + 30}px rgba(232,196,106,.9)` : '';
  });
  let ci = -1; CARDS.forEach((c, i) => { if (t >= c.flip + .5) ci = i; });
  const capEnd = at(19.6);
  if (ci >= 0 && t < capEnd) { $('#cap').textContent = CARDS[ci].cap; show($('#cap'), rise(t, CARDS[ci].flip + .5, .5) * (1 - seg(t, capEnd - .3, capEnd))); }
  else show($('#cap'), 0);
  $('#cap').style.top = ci === 2 ? '1320px' : '1210px';
  const nv = rise(t, at(20), .6); show($('#never'), t < at(22) ? nv : 0);

  // CTA
  show($('#s3'), win(t, at(22), 24));
  fade($('#c1'), at(22));
  const lg = rise(t, at(22) + .5, .8); show($('#eLogo'), lg, `scale(${.8 + lg * .2}) rotate(${(1 - lg) * -20}deg)`);
  const b = pop(t, 20.1, .4); show($('#eBtn'), b.o, `scale(${b.s})`);
  show($('#eUrl'), rise(t, 20.7, .5)); show($('#eIg'), rise(t, 20.9, .5));
};
kit.start();
</script>
</body>
</html>
