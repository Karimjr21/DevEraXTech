<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DevEraXTech: Them vs Us</title>
<link rel="stylesheet" href="kit/reel-kit.css">
<style>
  /* ARCADE: neon grid floor, CRT scanlines, fighting-game HUD, pixel dissolves */
  :root { --cyan: #29e7ff; --mag: #ff2bd6; --red: #ff3b3b; --bg: #0a0014; }
  #stage { background: var(--bg); }
  .mono { font-family: 'DejaVu Sans Mono', monospace; font-weight: 700; }
  .arc { font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -.03em; line-height: .92;
    text-shadow: 6px 0 0 var(--mag), -6px 0 0 var(--cyan); }
  #sky { background: linear-gradient(180deg, #07001a 0%, #1a0036 55%, #3a0050 70%, #0a0014 71%); }
  #sun { left: 290px; top: 820px; width: 500px; height: 500px; border-radius: 50%;
    background: linear-gradient(#ffe36e, #ff7a2b 45%, #ff2bd6 80%);
    -webkit-mask: repeating-linear-gradient(180deg, #000 0 26px, transparent 26px 36px); mask: repeating-linear-gradient(180deg, #000 0 26px, transparent 26px 36px); opacity: .55; }
  #floorWrap { left: 0; right: 0; top: 1362px; height: 560px; perspective: 380px; perspective-origin: 50% 0; overflow: hidden; }
  #floor { position: absolute; left: -1200px; right: -1200px; top: 0; height: 2400px; transform: rotateX(72deg); transform-origin: 50% 0;
    background-image: linear-gradient(var(--mag) 4px, transparent 4px), linear-gradient(90deg, var(--mag) 4px, transparent 4px);
    background-size: 140px 140px; box-shadow: inset 0 60px 80px -20px #0a0014; }
  #scan { background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 5px); mix-blend-mode: multiply; }
  #crt { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.85) 100%); }
  #pix { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(16, 1fr); }
  #pix i { background: var(--bg); opacity: 0; }
  /* HUD */
  #hud { left: 50px; right: 50px; top: 70px; height: 170px; }
  .hp { position: absolute; top: 20px; width: 400px; height: 44px; border: 4px solid #fff; background: #300; transform: skewX(-12deg); overflow: hidden; }
  .hp i { position: absolute; top: 0; bottom: 0; }
  #hpThem { left: 0; } #hpThem i { right: 0; background: linear-gradient(90deg, #ff7a2b, var(--red)); }
  #hpUs { right: 0; } #hpUs i { left: 0; right: 0; background: var(--gold-grad); }
  .hpName { position: absolute; top: 76px; font-size: 30px; letter-spacing: .08em; }
  #nThem { left: 6px; color: #ff9a9a; } #nUs { right: 6px; color: var(--gold-hi); }
  #timer { position: absolute; left: 50%; top: 0; width: 140px; margin-left: -70px; text-align: center; font-size: 80px; color: #fff; }
  #rnd { position: absolute; left: 50%; top: 96px; width: 300px; margin-left: -150px; text-align: center; font-size: 26px; letter-spacing: .2em; color: var(--cyan); }
  /* hook */
  .hookLine { font-size: 92px; white-space: nowrap; }
  #h1 { top: 560px; } #h2 { top: 670px; } #h3 { top: 800px; font-size: 138px; color: var(--red); }
  #stamp { left: 150px; top: 1080px; width: 780px; padding: 20px 0; text-align: center; border: 10px dashed var(--cyan); color: var(--cyan); font-size: 92px; letter-spacing: .12em; }
  /* select screen */
  #sel { top: 300px; font-size: 44px; letter-spacing: .25em; color: var(--cyan); }
  .card { top: 420px; width: 440px; height: 640px; border: 6px solid; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 40px; }
  #p1 { left: 60px; border-color: #777; background: linear-gradient(#2a2a2a, #111); }
  #p2 { right: 60px; border-color: var(--gold); background: linear-gradient(#3a2a00, #120b00); box-shadow: 0 0 60px rgba(245,213,115,.6); }
  .card .who { font-size: 26px; letter-spacing: .2em; margin-bottom: 14px; }
  .card b { font-size: 56px; text-align: center; line-height: 1; }
  #p1 .sil { width: 220px; height: 300px; margin-bottom: 40px; background: #555; border-radius: 110px 110px 20px 20px; opacity: .6; }
  #p2 img { width: 320px; margin-bottom: 50px; filter: drop-shadow(0 0 30px rgba(245,213,115,.8)); }
  #vsTxt { left: 0; right: 0; top: 1130px; font-size: 300px; text-align: center; }
  /* rounds */
  #fight { top: 760px; font-size: 200px; }
  .them, .us { left: 70px; right: 70px; display: flex; align-items: center; gap: 30px; }
  .them { top: 430px; }
  .us { top: 1130px; }
  .them b { font-size: 92px; color: #bdbdbd; font-weight: 900; text-transform: uppercase; letter-spacing: -.03em; line-height: .98; }
  .us b { font-size: 88px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -.035em; line-height: .96; }
  .badge { flex: none; width: 110px; height: 110px; display: grid; place-items: center; font-size: 64px; font-weight: 900; border: 5px solid; }
  .them .badge { color: var(--red); border-color: var(--red); background: rgba(255,59,59,.12); }
  .us .badge { color: #0b0904; background: var(--gold-grad); border-color: #fff; }
  .lane { left: 40px; right: 40px; height: 600px; border: 3px solid; }
  #laneThem { top: 300px; border-color: rgba(255,59,59,.55); background: rgba(24,4,14,.9); }
  #laneUs { top: 990px; border-color: rgba(245,213,115,.7); background: rgba(22,14,4,.9); }
  .laneTag { position: absolute; top: -26px; left: 30px; padding: 6px 18px; font-size: 30px; letter-spacing: .15em; background: var(--bg); }
  #laneThem .laneTag { color: var(--red); } #laneUs .laneTag { color: var(--gold-hi); }
  .hit { font-size: 64px; color: #fff; text-shadow: 4px 4px 0 var(--mag); }
  /* K.O. */
  #ko { top: 420px; font-size: 380px; color: var(--red); }
  #wins { top: 820px; font-size: 96px; }
  #perfect { top: 980px; font-size: 64px; letter-spacing: .2em; color: var(--cyan); }
  #score { top: 1120px; font-size: 220px; }
  /* continue */
  #cont { top: 330px; font-size: 110px; }
  #contN { top: 450px; font-size: 300px; color: var(--cyan); }
  #cLogo { left: 400px; top: 820px; width: 280px; }
  #press { left: 110px; right: 110px; top: 1120px; padding: 38px 0; text-align: center; font-size: 60px; background: var(--red); color: #fff; border: 6px solid #fff; box-shadow: 0 12px 0 #7a0000, 0 0 60px rgba(255,59,59,.6); }
  #url { top: 1340px; } #ig { top: 1430px; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="sky" class="layer"></div>
    <div id="sun" class="abs"></div>
    <div id="floorWrap" class="abs"><div id="floor"></div></div>

    <section id="sHook" class="scene">
      <div id="h1" class="abs cx arc hookLine">Your competitors</div>
      <div id="h2" class="abs cx arc hookLine">don't want you</div>
      <div id="h3" class="abs cx arc hookLine">to see this.</div>
      <div id="stamp" class="abs mono">TOP SECRET</div>
    </section>

    <section id="sVs" class="scene">
      <div id="sel" class="abs cx mono">SELECT YOUR STUDIO</div>
      <div id="p1" class="abs card mono"><div class="sil"></div><span class="who" style="color:#999">PLAYER 1</span><b style="color:#aaa">OTHER<br>AGENCIES</b></div>
      <div id="p2" class="abs card mono"><img src="assets/logo.png" alt=""><span class="who" style="color:var(--gold-hi)">PLAYER 2</span><b class="gold-text">DEVERAX<br>TECH</b></div>
      <div id="vsTxt" class="abs arc">VS</div>
    </section>

    <section id="sRounds" class="scene">
      <div id="laneThem" class="abs lane"><span class="laneTag mono">THEM</span></div>
      <div id="laneUs" class="abs lane"><span class="laneTag mono">US</span></div>
      <div id="rounds"></div>
      <div id="fight" class="abs cx arc">FIGHT!</div>
    </section>

    <section id="sScore" class="scene">
      <div id="ko" class="abs cx arc">K.O.</div>
      <div id="wins" class="abs cx arc gold-text" style="text-shadow:none">DevEraXTech wins</div>
      <div id="perfect" class="abs cx mono">★ PERFECT ★</div>
      <div id="score" class="abs cx arc">5 – 0</div>
    </section>

    <section id="sCta" class="scene">
      <div id="cont" class="abs cx arc">Continue?</div>
      <div id="contN" class="abs cx mono">9</div>
      <img id="cLogo" class="abs" src="assets/logo.png" alt="">
      <div id="press" class="abs mono">▶ REQUEST A MEETING</div>
      <div id="url" class="abs cx url gold-text">deveraxtech.com</div>
      <div id="ig" class="abs cx ig">@deveraxtech</div>
    </section>
  </div>
  <div id="hud" class="abs mono">
    <div id="hpThem" class="hp"><i></i></div><div id="hpUs" class="hp"><i></i></div>
    <div id="nThem" class="hpName">OTHER AGENCIES</div><div id="nUs" class="hpName">DEVERAXTECH</div>
    <div id="timer">99</div><div id="rnd">ROUND 1</div>
  </div>
  <div id="scan" class="layer"></div>
  <div id="crt" class="layer"></div>
  <div id="pix" class="layer"></div>
</div>

<script src="kit/reel-kit.js"></script>
<script>
const { seg, easeOut, back, decay, slam, pop, rise, win, show, rng, $ } = kit;
const R0 = 4, RLEN = 3, KO = 19, CTA = 21;
const ROUNDS = [
  ['Same template<br>as everyone', 'Designed<br>only for you'],
  ['Slow, heavy<br>pages', 'Built to<br>load fast'],
  ['Security as an<br>afterthought', 'Secure from<br>day one'],
  ['Days of<br>silence', 'Updates at<br>every step'],
  ['One language,<br>one market', '3 languages.<br>7 countries.'],
];
$('#rounds').innerHTML = ROUNDS.map(([a, b]) =>
  `<div class="them abs"><span class="badge mono">✕</span><b>${a}</b></div><div class="us abs"><span class="badge mono">✓</span><b class="gold-text">${b}</b></div>
   <div class="abs hit mono" style="left:700px;top:1000px">+100</div>`).join('');
// pixel dissolve cells, each with its own random delay
const pr = rng(21);
$('#pix').innerHTML = Array.from({ length: 144 }, () => '<i></i>').join('');
const cellDelay = Array.from({ length: 144 }, () => pr());
const WIPES = [2.45, 3.88, ...ROUNDS.map((_, i) => R0 + i * RLEN + 2.8).slice(0, 4), KO - .2, CTA - .2];

const chrome = kit.setup({
  duration: 24, bpm: 150, beatFrom: 4, beatTo: 23.4, goldFrom: 99,
  look: { gold: false, progress: false, handle: false, vignette: false, grain: .05, pump: .012, sparks: '41,231,255' },
  hits: [{ t: 0 }, { t: .5 }, { t: 1 }, { t: 1.5, amp: 24 }, { t: 3, amp: 22 }, { t: 4, amp: 30 },
    ...ROUNDS.map((_, i) => ({ t: R0 + i * RLEN + 1, amp: 20 })), { t: KO, amp: 34 }],
  bursts: [KO], whiteFlashes: [0, 1.5, 3, 4, KO],
});

window.render = function (t) {
  const { pump } = chrome(t);
  $('#floor').style.backgroundPosition = `0 ${(t * 280) % 140}px`;
  $('#sun').style.transform = `scale(${1 + pump * .03})`;
  const fly = t < 4 ? 1 : 0;
  // pixel dissolve: cells cover, then uncover, around each wipe time
  let cover = 0;
  for (const w of WIPES) cover = Math.max(cover, 1 - Math.abs(t - w) / .18);
  [...$('#pix').children].forEach((c, i) => { c.style.opacity = cellDelay[i] < cover ? 1 : 0; });

  // HUD appears at the drop
  show($('#hud'), t >= 2.45 ? 1 : 0);
  const clock = Math.max(0, 99 - Math.floor(Math.max(0, t - 4) * 3));
  $('#timer').textContent = clock;
  const ri = Math.min(4, Math.max(0, Math.floor((t - R0) / RLEN)));
  $('#rnd').textContent = t < R0 ? 'READY' : t < KO ? `ROUND ${ri + 1}` : 'FINAL';
  let hp = 1;
  ROUNDS.forEach((_, i) => { hp -= .2 * easeOut(seg(t, R0 + i * RLEN + 1, R0 + i * RLEN + 1.3)); });
  $('#hpThem i').style.left = `${(1 - Math.max(0, hp)) * 100}%`;
  $('#hpThem').style.boxShadow = `0 0 ${decay(t, R0 + ri * RLEN + 1, 6) * 50}px rgba(255,59,59,.9)`;

  // HOOK
  show($('#sHook'), win(t, 0, 2.45));
  [['#h1', 0], ['#h2', .5], ['#h3', 1]].forEach(([id, at]) => { const s = slam(t, at); show($(id), s.o, `scale(${s.s}) skewX(-8deg)`); });
  const st = seg(t, 1.5, 1.68);
  show($('#stamp'), st > 0 ? (Math.floor(t * 8) % 2 ? 1 : .75) : 0, `rotate(-6deg) scale(${2.2 - back(st) * 1.2})`);

  // SELECT SCREEN
  show($('#sVs'), win(t, 2.45, 3.88));
  show($('#sel'), Math.floor(t * 6) % 2 ? 1 : .4);
  const a = easeOut(seg(t, 2.5, 2.8)), b = easeOut(seg(t, 2.65, 2.95));
  show($('#p1'), 1, `translateX(${(1 - a) * -700}px)`);
  show($('#p2'), 1, `translateX(${(1 - b) * 700}px) scale(${1 + decay(t, 3, 6) * .06})`);
  const vs = slam(t, 3, .2); show($('#vsTxt'), vs.o, `scale(${vs.s}) skewX(-10deg)`);

  // ROUNDS
  show($('#sRounds'), win(t, R0, KO));
  const f = seg(t, R0 + ri * RLEN, R0 + ri * RLEN + .45);
  show($('#fight'), f > 0 && f < 1 ? 1 : 0, `scale(${1.4 - f * .5}) skewX(-10deg)`);
  $('#fight').textContent = ri === 0 ? 'FIGHT!' : `ROUND ${ri + 1}`;
  const them = [...document.querySelectorAll('.them')], us = [...document.querySelectorAll('.us')], hits = [...document.querySelectorAll('.hit')];
  ROUNDS.forEach((_, i) => {
    const r = R0 + i * RLEN, on = win(t, r + .35, r + RLEN - .15);
    const tk = rise(t, r + .35, .2);
    show(them[i], on * tk, `translateX(${(1 - tk) * -200 + Math.sin(t * 70) * decay(t, r + 1, 8) * 30}px)`);
    them[i].style.filter = t >= r + 1 ? 'grayscale(1) brightness(.6)' : '';
    const u = seg(t, r + 1, r + 1.18);
    show(us[i], on * (u > 0 ? 1 : 0), `scale(${1 + (1 - back(u)) * 1.1})`);
    const h = seg(t, r + 1.1, r + 1.9);
    show(hits[i], on * (h > 0 && h < 1 ? 1 - h : 0), `translateY(${-h * 160}px)`);
  });
  $('#laneUs').style.boxShadow = `0 0 ${decay(t, R0 + ri * RLEN + 1, 4) * 80}px rgba(245,213,115,.8) inset`;

  // K.O.
  show($('#sScore'), win(t, KO, CTA));
  let k = slam(t, KO, .2); show($('#ko'), k.o, `scale(${k.s}) skewX(-10deg)`);
  k = pop(t, KO + .5, .3); show($('#wins'), k.o, `scale(${k.s})`);
  show($('#perfect'), t >= KO + 1 ? (Math.floor(t * 8) % 2 ? 1 : .5) : 0);
  k = slam(t, 20.5, .2); show($('#score'), k.o, `scale(${k.s}) skewX(-8deg)`);

  // CONTINUE?
  show($('#sCta'), win(t, CTA, 24));
  k = slam(t, CTA, .2); show($('#cont'), k.o, `scale(${k.s}) skewX(-8deg)`);
  const n = 9 - Math.min(8, Math.floor(Math.max(0, t - CTA) * 2.5));
  $('#contN').textContent = n;
  show($('#contN'), t >= CTA + .2 ? 1 : 0, `scale(${1 + decay(t, CTA + .2 + (9 - n) * .4, 10) * .2})`);
  const lg = pop(t, CTA + .5, .3); show($('#cLogo'), lg.o, `scale(${lg.s})`);
  const p = pop(t, 22, .3);
  show($('#press'), p.o * (t > 22.5 && Math.floor(t * 4) % 2 ? .75 : 1), `scale(${p.s}) translateY(${pump * 6}px)`);
  const uu = rise(t, 22.5, .25); show($('#url'), uu, `translateY(${(1 - uu) * 30}px)`);
  const g = rise(t, 22.75, .25); show($('#ig'), g, `translateY(${(1 - g) * 30}px)`);
};
kit.start();
</script>
</body>
</html>
