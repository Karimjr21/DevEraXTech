<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* soft top and bottom shade so captions read over any shot */
      #shade {
        position: absolute;
        inset: 0;
        z-index: 3;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0) 32%, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, 0.35) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="29.0" data-width="1080" data-height="1920">
      <video id="v-h1-clock" class="clip" data-start="0.0" data-duration="3.88" data-track-index="1" muted playsinline src="assets/footage/h1-clock.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <video id="v-h2-deals" class="clip" data-start="3.88" data-duration="3.84" data-track-index="2" muted playsinline src="assets/footage/h2-deals.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <video id="v-q1-crowd" class="clip" data-start="7.72" data-duration="4.32" data-track-index="1" muted playsinline src="assets/footage/q1-crowd.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <video id="v-q2-hourglass" class="clip" data-start="12.04" data-duration="2.88" data-track-index="2" muted playsinline src="assets/footage/q2-hourglass.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <video id="v-q2-frustrated" class="clip" data-start="14.92" data-duration="3.37" data-track-index="1" muted playsinline src="assets/footage/q2-frustrated.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <video id="v-a1-shopping" class="clip" data-start="18.29" data-duration="2.87" data-track-index="2" muted playsinline src="assets/footage/a1-shopping.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <video id="v-a1-delivery" class="clip" data-start="21.16" data-duration="2.88" data-track-index="1" muted playsinline src="assets/footage/a1-delivery.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <video id="v-end-box" class="clip" data-start="24.04" data-duration="4.96" data-track-index="2" muted playsinline src="assets/footage/end-box.mp4" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"></video>
      <div id="shade"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="24.04" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="logo" data-composition-id="logo" data-composition-src="compositions/logo.html" data-start="24.04" data-duration="4.96" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>

      <!-- Footage: Mixkit (mixkit.co), Mixkit Stock Video Free License -->
      <!-- Music: "Werq" by Kevin MacLeod (incompetech.com), CC BY 4.0 -->
      <audio id="music" class="clip" data-start="0" data-duration="29.0" data-track-index="10" data-volume="0.42" data-fade-out="1.2" src="assets/music/werq-kevin-macleod.mp3"></audio>
      <audio id="s-tick1" class="clip" data-start="0.03" data-duration="0.12" data-track-index="11" data-volume="0.6" src="assets/sfx/bong_001.ogg"></audio>
      <audio id="s-date" class="clip" data-start="1.0" data-duration="0.05" data-track-index="12" data-volume="0.5" src="assets/sfx/select_008.ogg"></audio>
      <audio id="s-hit1" class="clip" data-start="2.93" data-duration="0.3" data-track-index="13" data-volume="0.7" src="assets/sfx/impactSoft_heavy_001.ogg"></audio>
      <audio id="s-cut1" class="clip" data-start="3.88" data-duration="0.6" data-track-index="14" data-volume="0.35" src="assets/sfx/card-slide-2.ogg"></audio>
      <audio id="s-c3" class="clip" data-start="5.8" data-duration="0.05" data-track-index="15" data-volume="0.5" src="assets/sfx/select_008.ogg"></audio>
      <audio id="s-cut2" class="clip" data-start="7.72" data-duration="0.3" data-track-index="16" data-volume="0.6" src="assets/sfx/impactWood_medium_002.ogg"></audio>
      <audio id="s-s2" class="clip" data-start="9.65" data-duration="0.05" data-track-index="17" data-volume="0.4" src="assets/sfx/select_008.ogg"></audio>
      <audio id="s-cut3" class="clip" data-start="12.04" data-duration="0.3" data-track-index="18" data-volume="0.6" src="assets/sfx/impactSoft_heavy_001.ogg"></audio>
      <audio id="s-c6" class="clip" data-start="14.92" data-duration="0.2" data-track-index="19" data-volume="0.5" src="assets/sfx/impactWood_medium_001.ogg"></audio>
      <audio id="s-c7" class="clip" data-start="16.85" data-duration="0.05" data-track-index="20" data-volume="0.5" src="assets/sfx/select_008.ogg"></audio>
      <audio id="s-cut4" class="clip" data-start="18.29" data-duration="0.3" data-track-index="21" data-volume="0.6" src="assets/sfx/impactWood_medium_002.ogg"></audio>
      <audio id="s-c9" class="clip" data-start="20.2" data-duration="0.05" data-track-index="22" data-volume="0.5" src="assets/sfx/select_008.ogg"></audio>
      <audio id="s-c10" class="clip" data-start="22.13" data-duration="0.2" data-track-index="23" data-volume="0.5" src="assets/sfx/impactWood_medium_001.ogg"></audio>
      <audio id="s-stamp" class="clip" data-start="24.09" data-duration="0.3" data-track-index="24" data-volume="0.7" src="assets/sfx/impactSoft_heavy_001.ogg"></audio>
      <audio id="s-sig" class="clip" data-start="24.13" data-duration="2.8" data-track-index="25" data-volume="0.6" src="assets/sfx/sig-full.wav"></audio>
    </div>
    <script>
      const main = gsap.timeline({ paused: true });
      // slow handheld-style push on every shot
      main.fromTo("#v-h1-clock", { scale: 1.0 }, { scale: 1.06, duration: 3.88, ease: "none" }, 0.0);
      main.fromTo("#v-h2-deals", { scale: 1.0 }, { scale: 1.06, duration: 3.84, ease: "none" }, 3.88);
      main.fromTo("#v-q1-crowd", { scale: 1.0 }, { scale: 1.06, duration: 4.32, ease: "none" }, 7.72);
      main.fromTo("#v-q2-hourglass", { scale: 1.0 }, { scale: 1.06, duration: 2.88, ease: "none" }, 12.04);
      main.fromTo("#v-q2-frustrated", { scale: 1.0 }, { scale: 1.06, duration: 3.37, ease: "none" }, 14.92);
      main.fromTo("#v-a1-shopping", { scale: 1.0 }, { scale: 1.06, duration: 2.87, ease: "none" }, 18.29);
      main.fromTo("#v-a1-delivery", { scale: 1.0 }, { scale: 1.06, duration: 2.88, ease: "none" }, 21.16);
      main.fromTo("#v-end-box", { scale: 1.0 }, { scale: 1.06, duration: 4.96, ease: "none" }, 24.04);
      window.__timelines["main"] = main;
    </script>
  </body>
</html>
